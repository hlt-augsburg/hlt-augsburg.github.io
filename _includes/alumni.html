<!-- Alumni Section -->
    <section id="team" class="bg-light-gray">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">Alumni</h2>
                </div>
            </div>
            <div class="row">
                {% for member in site.data.alumni %}
                <div class="col-sm-4" style="height:400px">
                    <div class="team-member">
                        <img src="img/team/{{ member.pic }}.jpg" class="img-responsive img-circle" alt="">
                        <h4>{{ member.name }}</h4>
                        <p>{{ member.position }}</p>
                        <p class="text-muted">{{ member.affiliation }}<br/>
                        <a href="{{member.websiteurl}}">{{member.website}}</a></p>
                        <!--ul class="list-inline social-buttons">
                            {% for network in member.social %}
                            <li>
                                <a href="{{ network.url }}">
                                    <i class="fa fa-{{ network.title }}"></i>
                                </a>
                            </li>
                            {% endfor %}

                        </ul-->
                    </div>
                </div>
                {% endfor %}
            </div>

                <div class="col-lg-8 col-lg-offset-2 text-center">

                </div>

        </div>
    </section>
